[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vo-agent"
version = "0.1.0"
description = "Evidence-gated workflows for coordinating coding agents."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []
keywords = ["agents", "workflows", "verification", "automation", "research"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.scripts]
vo = "vo.cli:main"

[project.urls]
Homepage = "https://github.com/metaforismo/vo-agent"
Repository = "https://github.com/metaforismo/vo-agent"
Issues = "https://github.com/metaforismo/vo-agent/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/vo"]
