name: Feature request
description: Propose a workflow, runtime, or infrastructure capability.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What agent workflow are you trying to express or run?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the API, runtime behavior, or infrastructure support you want.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: How should this feature be tested or proven correct?
    validations:
      required: true
